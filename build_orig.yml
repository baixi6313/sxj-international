name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SXJ_KEYSTORE_BASE64: ${{ secrets.SXJ_KEYSTORE_BASE64 }}
      SXJ_KEYSTORE_PASSWORD: ${{ secrets.SXJ_KEYSTORE_PASSWORD }}
      SXJ_KEY_ALIAS: ${{ secrets.SXJ_KEY_ALIAS }}
      SXJ_KEY_PASSWORD: ${{ secrets.SXJ_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.4'
          arguments: assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sxj-app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Build release AAB
        if: ${{ env.SXJ_KEYSTORE_BASE64 != '' }}
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.4'
          arguments: bundleRelease

      - name: Upload AAB artifact
        if: ${{ env.SXJ_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sxj-app-release
          path: app/build/outputs/bundle/release/*.aab
