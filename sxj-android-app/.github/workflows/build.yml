name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SXJ_KEYSTORE_BASE64: ${{ secrets.SXJ_KEYSTORE_BASE64 }}
      SXJ_KEYSTORE_PASSWORD: ${{ secrets.SXJ_KEYSTORE_PASSWORD }}
      SXJ_KEY_ALIAS: ${{ secrets.SXJ_KEY_ALIAS }}
      SXJ_KEY_PASSWORD: ${{ secrets.SXJ_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.4'
          arguments: assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sxj-app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Build release AAB
        if: ${{ env.SXJ_KEYSTORE_BASE64 != '' }}
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.4'
          arguments: bundleRelease

      - name: Upload AAB artifact
        if: ${{ env.SXJ_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sxj-app-release
          path: app/build/outputs/bundle/release/*.aab

      - name: Resolve version
        id: ver
        run: |
          V=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "解析到 versionName = $V"

      - name: Publish debug APK to versioned Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          gh release view "$TAG" --repo baixi6313/sxj-android-app >/dev/null 2>&1 \
            || gh release create "$TAG" --title "事现鉴 App $TAG" --notes "自动构建发布 $TAG" --repo baixi6313/sxj-android-app
          gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk --clobber --repo baixi6313/sxj-android-app
